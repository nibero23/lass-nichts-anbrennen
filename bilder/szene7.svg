  <rect x="110" y="246" width="80" height="50" fill="#fafafa" stroke="#d0d0d0" stroke-width="2"/><line x1="110" y1="260" x2="190" y2="260" stroke="#e0e0e0" stroke-width="2"/><line x1="110" y1="272" x2="190" y2="272" stroke="#e0e0e0" stroke-width="2"/><line x1="110" y1="284" x2="190" y2="284" stroke="#e0e0e0" stroke-width="2"/><rect x="210" y="246" width="80" height="50" fill="#fafafa" stroke="#d0d0d0" stroke-width="2"/><line x1="210" y1="260" x2="290" y2="260" stroke="#e0e0e0" stroke-width="2"/><line x1="210" y1="272" x2="290" y2="272" stroke="#e0e0e0" stroke-width="2"/><line x1="210" y1="284" x2="290" y2="284" stroke="#e0e0e0" stroke-width="2"/><rect x="110" y="366" width="80" height="50" fill="#fafafa" stroke="#d0d0d0" stroke-width="2"/><line x1="110" y1="380" x2="190" y2="380" stroke="#e0e0e0" stroke-width="2"/><line x1="110" y1="392" x2="190" y2="392" stroke="#e0e0e0" stroke-width="2"/><line x1="110" y1="404" x2="190" y2="404" stroke="#e0e0e0" stroke-width="2"/><rect x="230" y="366" width="80" height="50" fill="#fafafa" stroke="#d0d0d0" stroke-width="2"/><line x1="230" y1="380" x2="310" y2="380" stroke="#e0e0e0" stroke-width="2"/><line x1="230" y1="392" x2="310" y2="392" stroke="#e0e0e0" stroke-width="2"/><line x1="230" y1="404" x2="310" y2="404" stroke="#e0e0e0" stroke-width="2"/><rect x="140" y="486" width="80" height="50" fill="#fafafa" stroke="#d0d0d0" stroke-width="2"/><line x1="140" y1="500" x2="220" y2="500" stroke="#e0e0e0" stroke-width="2"/><line x1="140" y1="512" x2="220" y2="512" stroke="#e0e0e0" stroke-width="2"/><line x1="140" y1="524" x2="220" y2="524" stroke="#e0e0e0" stroke-width="2"/>
  <rect x="600" y="360" width="280" height="290" rx="14" fill="#d5d9de" stroke="#9aa1a9" stroke-width="4"/>
  <rect x="590" y="330" width="300" height="36" rx="8" fill="#b7bec6"/>
  <rect x="880" y="450" width="60" height="14" fill="#c5ccd3"/>
  <rect x="790" y="380" width="80" height="44" rx="6" fill="#3a3f47"/><rect x="798" y="388" width="44" height="20" fill="#4fc3f7"/><circle cx="856" cy="398" r="6" fill="#43a047"/>
  <line x1="620" y1="470" x2="860" y2="470" stroke="#aab1b9" stroke-width="4"/><line x1="620" y1="530" x2="860" y2="530" stroke="#aab1b9" stroke-width="4"/><line x1="620" y1="590" x2="860" y2="590" stroke="#aab1b9" stroke-width="4"/>
  <ellipse class="gluehen" cx="495" cy="520" rx="190" ry="170" fill="url(#glut)"/>
  
  <g fill="#5f6368" filter="url(#weich)"><ellipse class="rauch v0" cx="481" cy="400" rx="42" ry="33.6"/><ellipse class="rauch v1" cx="509" cy="400" rx="42" ry="33.6"/><ellipse class="rauch v2" cx="481" cy="400" rx="42" ry="33.6"/><ellipse class="rauch v3" cx="509" cy="400" rx="42" ry="33.6"/><ellipse class="rauch v4" cx="481" cy="400" rx="42" ry="33.6"/>
  </g>
  
  <g transform="translate(480,566)"><g class="flackern v0">
    <use href="#fl" fill="#ff5a1f" transform="scale(0.8)"/>
    <use href="#fl" fill="#ff9d00" transform="translate(3.2,0) scale(0.576)"/>
    <use href="#fl" fill="#ffe066" transform="translate(6.4,0) scale(0.336)"/>
  </g></g>
  <g transform="translate(452,568)"><g class="flackern v2">
    <use href="#fl" fill="#ff5a1f" transform="scale(0.45)"/>
    <use href="#fl" fill="#ff9d00" transform="translate(1.8,0) scale(0.324)"/>
    <use href="#fl" fill="#ffe066" transform="translate(3.6,0) scale(0.189)"/>
  </g></g>
  <g transform="translate(522,568)"><g class="flackern v1">
    <use href="#fl" fill="#ff5a1f" transform="scale(0.5)"/>
    <use href="#fl" fill="#ff9d00" transform="translate(2,0) scale(0.36)"/>
    <use href="#fl" fill="#ffe066" transform="translate(4,0) scale(0.21)"/>
  </g></g>
  <polygon points="430,560 560,560 545,650 445,650" fill="#4b5158"/>
  <line x1="455" y1="562" x2="452" y2="648" stroke="#3a3f45" stroke-width="3"/><line x1="480" y1="562" x2="477" y2="648" stroke="#3a3f45" stroke-width="3"/><line x1="505" y1="562" x2="502" y2="648" stroke="#3a3f45" stroke-width="3"/><line x1="530" y1="562" x2="527" y2="648" stroke="#3a3f45" stroke-width="3"/>
