<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" font-family="Segoe UI, Arial, sans-serif">
<!-- Animierte Szene für „Lass nichts anbrennen“: gezeichnet mit Code (SVG + CSS-Animation), keine fremde Grafik -->
<style>
.flackern { transform-box: fill-box; transform-origin: 50% 100%; animation: flackern .45s ease-in-out infinite alternate; }
@keyframes flackern { from { transform: scale(.92,.86); } to { transform: scale(1.06,1.12); } }
.rauch { transform-box: fill-box; transform-origin: 50% 50%; opacity: 0; animation: rauch 3s ease-out infinite; }
@keyframes rauch { 0% { transform: translateY(0) scale(.6); opacity: 0; } 20% { opacity: .55; } 100% { transform: translateY(-170px) scale(1.7); opacity: 0; } }
.dampf { animation: dampf 2.4s ease-in-out infinite; }
@keyframes dampf { 0% { transform: translateY(10px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(-50px); opacity: 0; } }
.blinken { animation: blinken 1s steps(1) infinite; }
@keyframes blinken { 50% { opacity: .12; } }
.gluehen { animation: gluehen 1.4s ease-in-out infinite alternate; }
@keyframes gluehen { from { opacity: .3; } to { opacity: 1; } }
.pulsieren { transform-box: fill-box; transform-origin: center; animation: pulsieren 1s ease-in-out infinite alternate; }
@keyframes pulsieren { from { transform: scale(1); } to { transform: scale(1.14); } }
.welle { transform-box: fill-box; transform-origin: center; animation: welle 1.6s ease-out infinite; }
@keyframes welle { from { transform: scale(.5); opacity: .9; } to { transform: scale(2.4); opacity: 0; } }
.laufweg { animation: laufweg 1s linear infinite; }
@keyframes laufweg { to { stroke-dashoffset: -60; } }
.wackeln { transform-box: fill-box; transform-origin: 50% 100%; animation: wackeln 2.6s ease-in-out infinite; }
@keyframes wackeln { 0%, 70%, 100% { transform: rotate(0); } 78% { transform: rotate(-3deg); } 86% { transform: rotate(2deg); } 92% { transform: rotate(-1deg); } }
.laeuten { transform-box: fill-box; transform-origin: 50% 20%; animation: laeuten .16s linear infinite alternate; }
@keyframes laeuten { from { transform: rotate(-11deg); } to { transform: rotate(11deg); } }
.tuer { animation: tuer 3s ease-in-out infinite; }
@keyframes tuer { 0%, 50%, 100% { transform: translateX(0); } 62% { transform: translateX(-18px); } 70% { transform: translateX(-5px); } 77% { transform: translateX(-12px); } 85% { transform: translateX(0); } }
.aufblaehen { transform-box: fill-box; transform-origin: center; animation: aufblaehen 1.8s ease-in-out infinite alternate; }
@keyframes aufblaehen { from { transform: scale(1, .97); } to { transform: scale(1.03, 1.07); } }
.punkt { animation: punkt 1.2s ease-in-out infinite; }
@keyframes punkt { 0%, 100% { opacity: .15; } 50% { opacity: .75; } }
.drehen { transform-box: view-box; animation: drehen 6s linear infinite; }
@keyframes drehen { to { transform: rotate(360deg); } }
.v0 { animation-delay: 0s; } .v1 { animation-delay: -.6s; } .v2 { animation-delay: -1.2s; } .v3 { animation-delay: -1.8s; } .v4 { animation-delay: -2.4s; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .rauch { opacity: .35; } }
</style>
<defs>
  <path id="fl" d="M0,0 C-58,-4 -80,-62 -48,-122 C-40,-98 -24,-92 -18,-104 C-30,-156 -2,-196 22,-226 C26,-176 62,-152 66,-104 C72,-122 78,-134 72,-154 C108,-112 104,-30 58,-6 C42,2 16,3 0,0 Z"/>
  <filter id="weich" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  <radialGradient id="glut" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#ff8a00" stop-opacity="0.65"/><stop offset="1" stop-color="#ff8a00" stop-opacity="0"/>
  </radialGradient>
  <pattern id="fliese" width="80" height="80" patternUnits="userSpaceOnUse"><rect width="80" height="80" fill="#eef1f3"/><path d="M80 0 V80 M0 80 H80" stroke="#d3d9de" stroke-width="3"/></pattern></defs>

  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a0f08"/><stop offset="1" stop-color="#140504"/></linearGradient></defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <ellipse class="gluehen" cx="600" cy="560" rx="520" ry="380" fill="url(#glut)"/>
  <circle cx="1010" cy="220" r="92" fill="#2a0c07" stroke="#f3d2b0" stroke-width="10"/>
  <line x1="1010" y1="146" x2="1010" y2="160" stroke="#f3d2b0" stroke-width="6" transform="rotate(0 1010 220)"/><line x1="1010" y1="146" x2="1010" y2="160" stroke="#f3d2b0" stroke-width="6" transform="rotate(30 1010 220)"/><line x1="1010" y1="146" x2="1010" y2="160" stroke="#f3d2b0" stroke-width="6" transform="rotate(60 1010 220)"/><line x1="1010" y1="146" x2="1010" y2="160" stroke="#f3d2b0" stroke-width="6" transform="rotate(90 1010 220)"/><line x1="1010" y1="146" x2="1010" y2="160" stroke="#f3d2b0" stroke-width="6" transform="rotate(120 1010 220)"/><line x1="1010" y1="146" x2="1010" y2="160" stroke="#f3d2b0" stroke-width="6" transform="rotate(150 1010 220)"/><line x1="1010" y1="146" x2="1010" y2="160" stroke="#f3d2b0" stroke-width="6" transform="rotate(180 1010 220)"/><line x1="1010" y1="146" x2="1010" y2="160" stroke="#f3d2b0" stroke-width="6" transform="rotate(210 1010 220)"/><line x1="1010" y1="146" x2="1010" y2="160" stroke="#f3d2b0" stroke-width="6" transform="rotate(240 1010 220)"/><line x1="1010" y1="146" x2="1010" y2="160" stroke="#f3d2b0" stroke-width="6" transform="rotate(270 1010 220)"/><line x1="1010" y1="146" x2="1010" y2="160" stroke="#f3d2b0" stroke-width="6" transform="rotate(300 1010 220)"/><line x1="1010" y1="146" x2="1010" y2="160" stroke="#f3d2b0" stroke-width="6" transform="rotate(330 1010 220)"/>
  <line x1="1010" y1="220" x2="961" y2="248" stroke="#f3d2b0" stroke-width="12" stroke-linecap="round"/>
  <line x1="1010" y1="220" x2="1010" y2="150" stroke="#f3d2b0" stroke-width="8" stroke-linecap="round"/>
  <line class="drehen" style="transform-origin: 1010px 220px" x1="1010" y1="232" x2="1010" y2="140" stroke="#ff7043" stroke-width="4" stroke-linecap="round"/>
  <circle cx="1010" cy="220" r="8" fill="#ff7043"/>
  <rect x="0" y="690" width="1200" height="210" fill="#0b0302"/>
  <rect x="120" y="430" width="300" height="200" rx="12" fill="#0b0302"/>
  <rect x="255" y="630" width="30" height="60" fill="#0b0302"/>
  <rect x="200" y="676" width="140" height="16" rx="8" fill="#0b0302"/>
  
  <g fill="#2a1410" filter="url(#weich)"><ellipse class="rauch v0" cx="606" cy="520" rx="50" ry="40"/><ellipse class="rauch v1" cx="634" cy="520" rx="50" ry="40"/><ellipse class="rauch v2" cx="606" cy="520" rx="50" ry="40"/><ellipse class="rauch v3" cx="634" cy="520" rx="50" ry="40"/><ellipse class="rauch v4" cx="606" cy="520" rx="50" ry="40"/>
  </g>
  <rect x="470" y="652" width="260" height="40" rx="12" fill="#1c0906" stroke="#ff9d00" stroke-width="3"/>
  <circle cx="510" cy="672" r="10" fill="#3a1a12"/><circle cx="560" cy="672" r="10" fill="#3a1a12"/><circle cx="610" cy="672" r="10" fill="#3a1a12"/><circle cx="660" cy="672" r="10" fill="#3a1a12"/>
  
  <g transform="translate(600,656)"><g class="flackern v0">
    <use href="#fl" fill="#ff5a1f" transform="scale(1.7)"/>
    <use href="#fl" fill="#ff9d00" transform="translate(6.8,0) scale(1.224)"/>
    <use href="#fl" fill="#ffe066" transform="translate(13.6,0) scale(0.714)"/>
  </g></g>
  <g transform="translate(545,658)"><g class="flackern v2">
    <use href="#fl" fill="#ff5a1f" transform="scale(0.8)"/>
    <use href="#fl" fill="#ff9d00" transform="translate(3.2,0) scale(0.576)"/>
    <use href="#fl" fill="#ffe066" transform="translate(6.4,0) scale(0.336)"/>
  </g></g>
  <g transform="translate(665,658)"><g class="flackern v1">
    <use href="#fl" fill="#ff5a1f" transform="scale(0.9)"/>
    <use href="#fl" fill="#ff9d00" transform="translate(3.6,0) scale(0.648)"/>
    <use href="#fl" fill="#ffe066" transform="translate(7.2,0) scale(0.378)"/>
  </g></g>
  <rect x="860" y="600" width="90" height="90" rx="10" fill="#0b0302"/>
  <path d="M950 620 Q995 645 950 670" stroke="#0b0302" stroke-width="14" fill="none"/>
</svg>
